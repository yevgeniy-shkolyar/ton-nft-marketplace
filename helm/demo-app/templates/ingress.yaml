apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/issuer: letsencrypt-production
    kubernetes.io/tls-acme: "true"
    nginx.org/proxy-connect-timeout: 300s
    nginx.org/proxy-read-timeout: 300s
    nginx.org/proxy-send-timeout: 300s
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/cors-allow-headers: Content-Type
    nginx.ingress.kubernetes.io/cors-allow-methods: POST, GET, OPTIONS
    nginx.ingress.kubernetes.io/cors-allow-origin: http://{{ .Values.ingress.host }}
    nginx.ingress.kubernetes.io/cors-expose-headers: X-Custom-Header
spec:
  tls:
  - secretName: tls-secret
    hosts: 
      - {{ .Values.ingress.host }}
    secretName: selfsigned-cert-tls
  ingressClassName: nginx
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: /graphql
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.api.name }}
            port:
              number: 3000
      - path: /playground
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.api.name }}
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.client.name }}
            port:
              number: 3000
