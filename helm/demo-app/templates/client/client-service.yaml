apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.client.name }}
  labels:
    name: {{ .Values.client.name }}
    {{- include "app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.client.service.type }}
  ports:
    - port: {{ .Values.client.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    name: {{ .Values.client.name }}
    {{- include "app.selectorLabels" . | nindent 4 }}
