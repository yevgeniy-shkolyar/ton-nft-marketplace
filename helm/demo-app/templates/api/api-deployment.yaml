{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-api
  labels:
    name: demo-app-api
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      name: demo-app-api
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        name: demo-app-api
        {{- include "app.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "app.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      imagePullSecrets: 
        - name: gitlab-token-auth
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.app.registry }}/api:{{ .Values.app.version | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.api.service.port | quote }}
            - name: GRAPHQL_PLAYGROUND
              value: "true"
            - name: GRAPHQL_INTROSPECTION
              value: "true"
            - name: GRAPHQL_GENERATE_SCHEMA
              value: "false"
            - name: TELEGRAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: demo-app-secret
                  key: telegramToken
            - name: TON_BASE_URL
              value: {{ .Values.ton.baseUrl | quote }}
            - name: NOTION_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: demo-app-secret
                  key: notionAppSecret
            - name: NOTION_DATABASE_ID
              valueFrom:
                secretKeyRef:
                  name: demo-app-secret
                  key: notionDatabaseId
            - name: TON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: demo-app-secret
                  key: tonApiKey
            - name: API_SECRET
              valueFrom:
                secretKeyRef:
                  name: demo-app-secret
                  key: apiSecret
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
