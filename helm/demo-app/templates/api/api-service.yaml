apiVersion: v1
kind: Service
metadata:
  name: demo-app-api
  labels:
    name: demo-app-api
    {{- include "app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    name: demo-app-api
    {{- include "app.selectorLabels" . | nindent 4 }}
